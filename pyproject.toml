[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vix-driver"
version = "0.1.0"
description = "Python driver for Parker ViX250IM / ViX500IM microstepper indexer drives (EASI-V over RS232)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["vix_driver"]
